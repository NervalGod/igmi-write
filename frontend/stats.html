<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статистика — Локальный редактор текста</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
<header class="header">
  <div class="header__brand">
    <svg class="header__logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 3v18h18"></path>
      <path d="M7 14l4-4 4 4 5-5"></path>
    </svg>
    <h1>Статистика использования</h1>
  </div>
  <div class="header__actions">
<button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
  <!-- Луна: видна в светлой теме (чтобы переключиться на тёмную) -->
  <svg class="theme-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
  </svg>
  <!-- Солнце: видно в тёмной теме (чтобы переключиться на светлую) -->
  <svg class="theme-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5"></circle>
    <line x1="12" y1="1" x2="12" y2="3"></line>
    <line x1="12" y1="21" x2="12" y2="23"></line>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
    <line x1="1" y1="12" x2="3" y2="12"></line>
    <line x1="21" y1="12" x2="23" y2="12"></line>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
  </svg>
</button>
  </div>
</header>

    <main class="stats-layout">
      <!-- Счётчики сверху -->
      <section class="counters" id="counters">
        <div class="counter">
          <div class="counter__value" id="counterDocs">0</div>
          <div class="counter__label">документов обработано</div>
        </div>
        <div class="counter">
          <div class="counter__value" id="counterUsers">0</div>
          <div class="counter__label">уникальных пользователей</div>
        </div>
        <div class="counter">
          <div class="counter__value" id="counter30d">0</div>
          <div class="counter__label">запусков за 30 дней</div>
        </div>
        <div class="counter">
          <div class="counter__value" id="counterToday">0</div>
          <div class="counter__label">документов за сегодня</div>
        </div>
      </section>

      <!-- Основная сетка: график + пользователи -->
      <div class="stats-grid">
        <section class="panel stats-card">
          <div class="panel__header">
            <h2>📈 Активность за 14 дней</h2>
          </div>
          <div class="chart-container">
            <div class="chart" id="activityChart">
              <div class="placeholder">Загрузка...</div>
            </div>
          </div>
          <div class="chart-legend">
            <span class="chart-legend__item">
              <span class="chart-legend__color"></span>
              Обработанные документы
            </span>
          </div>
        </section>

        <section class="panel stats-card">
          <div class="panel__header">
            <h2>👥 Активные пользователи</h2>
          </div>
          <div class="users-list" id="usersList">
            <div class="placeholder">Загрузка...</div>
          </div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <code>*IGMI Document Generator · статистика обновляется автоматически</code>
    </footer>
  </div>

  <div class="toast" id="toast">
    <span class="toast__icon">✅</span>
    <span class="toast__text" id="toastText"></span>
  </div>

  <script src="stats.js"></script>
</body>
</html>
