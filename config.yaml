source_path: "input/1902-ИГМИ.docx"
template_path: "input/Выходной_док_Климат_ПД_240527 (003).docx"
output_path: "output/output07.docx"
model: "qwen3.6:35b"

# Модель для эмбеддингов (семантический предфильтр контекста).
embed_model: "bge-m3"

# Размер контекстного окна.
num_ctx: 16384

# 0 — детерминированный вывод
temperature: 0.0

# Сколько держать модель в памяти между вызовами.
keep_alive: "3m"

# Лимит длины ответа модели. -1 = без ограничения (кроме num_ctx).
num_predict: -1

# Имя лог-файла (будет очищен при каждом запуске).
log_file: "generation.log"

#---не тестировалось---

# Куда сохранять результат извлечения (шаг 1: LLM + эмбеддинги) в JSON.
# Позволяет не гонять LLM заново, если что-то упадёт на шаге записи в docx
# или при сохранении файла - просто перезапустите с use_extraction_cache: true.
extraction_cache_path: "extraction_cache.json"

# true = если файл extraction_cache_path уже существует, взять данные из
# него и НЕ вызывать LLM вообще (только шаг 2 — запись в docx).
# false (по умолчанию) = всегда вызывать LLM заново и перезаписывать кэш.
use_extraction_cache: false