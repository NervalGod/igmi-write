source_path: "input/1902-ИГМИ.docx"
template_path: "input/Выходной_док_Климат_ПД_240527 (003).docx"
output_path: "output/outputmd2.docx"
model: "qwen3.6:35b"

# Модель для эмбеддингов (семантический предфильтр контекста).
# Перед первым запуском: ollama pull bge-m3
embed_model: "bge-m3"

# Размер контекстного окна. Раньше стояло 65536 "про запас" — если это
# заставляет часть весов модели уходить на CPU (offload), это может быть
# основным источником медлительности. Проверьте `ollama ps` во время
# генерации: если модель не полностью на GPU — снижайте это значение,
# пока не влезет. Логи (generation.log) покажут фактическую длину
# промптов в символах — ориентируйтесь на них.
num_ctx: 16384

# 0 — детерминированный вывод, важно для задачи извлечения фактов
# (не для генерации "творческого" текста).
temperature: 0.0

# Сколько держать модель в памяти между двумя вызовами.
keep_alive: "30m"
